<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Lezer parser playground</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #f0f0f0;
    }

    h2 {
      margin-top: 0;
    }

    .editors-panel {
      display: flex;
      gap: 20px;
      height: 80vh;
    }

    .editor-container {
      overflow: auto;
    }

    .editor-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: white;
      border: 1px solid #ccc;
      border-radius: 4px;
      overflow: hidden;
    }

    .editor-header {
      padding: 10px;
      background: #eee;
      border-bottom: 1px solid #ccc;
      font-weight: bold;
    }

    .cm-editor {
      height: 100%;
    }
  </style>
</head>

<body>
  <h1>Lezer parser playground</h1>
  <div class="editors-panel">

    <div class="editor-wrapper">
      <div class="editor-header">6502 Assembly</div>
      <div class="editor-container" id="editor-6502"></div>
    </div>

    <div class="editor-wrapper">
      <div class="editor-header">Z80 Assembly</div>
      <div class="editor-container" id="editor-z80"></div>
    </div>

    <div class="editor-wrapper">
      <div class="editor-header">C</div>
      <div class="editor-container" id="editor-c"></div>
    </div>

  </div>
  <script type="module" src="./dist/demo.bundle.js"></script>
</body>

</html>
